<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>funi bootstrap responsiveness</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <style>
      * {
        border-radius: 0 !important;
      }

      body {
        background-color: #24273a;
      }

      .text-ctp {
        color: #cad3f5 !important;
      }

      .card {
        min-height: 4rem;
        background-color: #494d64;
        border-color: #8087a2;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="row mt-5 g-2" id="parent">
        <a href="https://yomii-dev.github.io" class="col-1">
          <div
            class="card text-ctp justify-content-center align-items-center h-100"
          >
            back
          </div>
        </a>

        <div class="col-8">
          <div class="card text-ctp p-3 justify-content-center h-100">
            <h3>Web Dev Activities</h3>
          </div>
        </div>

        <div class="col-3">
          <div
            class="card text-ctp p-3 justify-content-center align-items-center h-100"
          >
            <p>yes im too lazy to make this pretty atm</p>
          </div>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>

    <script>
      addCard("webdev-activities");

      function addCard(subject, filePath = "data.json") {
        let data;
        let parentElement = document.getElementById("parent");

        fetch(filePath)
          .then((response) => response.json())
          .then((subjects) => {
            data = subjects[subject];
            data.forEach((act) => {
              parentElement.innerHTML += `
            <a
              href="${subject}/${act.directory}/index.html"
              class="col-12 col-md-6 col-lg-3"
            >
              <div class="card text-ctp p-3 h-100">
                <h3>${act.title}</h3>
              </div>
            </a>
            `;
            });
          });
      }
    </script>
  </body>
</html>
