<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>uh</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <!--Navbar-->
    <nav class="navbar navbar-expand-lg sticky-top bg-secondary-subtle">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">
          <img src="" alt="Site Icon" class="rounded-3" style="height: 40px" />
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <div class="navbar-nav">
            <a href="../../index.html" class="nav-link">Home</a>
          </div>
        </div>
      </div>
    </nav>

    <!--Main content-->
    <div class="container mt-5">
      <div class="row gx-5">
        <!--Left search + filter thing-->
        <div class="col-3">
          <div
            class="card p-3 d-flex flex-column sticky-top gap-1"
            style="top: 6rem"
          >
            <!--search thingie-->
            <label for="searchInput" class="form-label">Search</label>
            <input type="text" class="form-control" id="searchInput" />

            <!--filter-->
            <label for="type" class="form-label mt-3">Type</label>
            <select class="form-select" aria-label="type" id="type">
              <option selected value="characters">Characters</option>
              <option value="books">Books</option>
              <option value="houses">Houses</option>
              <option value="spells">Spells</option>
            </select>

            <!--button-->
            <button class="btn btn-primary mt-3" onclick="search()">
              boop
            </button>

            <div class="d-flex gap-2"></div>

            <nav aria-label="..." class="mx-auto">
              <ul class="pagination">
                <li class="page-item">
                  <button
                    class="btn btn-primary page-link"
                    onclick="movePage('previous')"
                    id="prevPage"
                  >
                    prev
                  </button>
                </li>

                <li class="page-item">
                  <span class="page-link" id="currentPage">1</span>
                </li>

                <li class="page-item">
                  <button
                    class="btn btn-primary page-link"
                    onclick="movePage('next')"
                    id="nextPage"
                  >
                    next
                  </button>
                </li>
              </ul>
            </nav>
          </div>
        </div>

        <!--Character cards and stuff-->
        <div class="col-9">
          <div class="row gy-4" id="parent">
            <!--js fills this thingie-->
          </div>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>

    <script src="assets/js/script.js"></script>
  </body>
</html>
