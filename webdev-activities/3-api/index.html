<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootstrap demo</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <!--Navbar-->
    <nav class="navbar navbar-expand-lg sticky-top bg-ctp-crust">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">
          <img src="" alt="Site Icon" class="rounded-3" style="height: 40px" />
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <div class="navbar-nav">
            <a href="../../index.html" class="nav-link">Home</a>
          </div>
        </div>
      </div>
    </nav>

    <!--Main content-->
    <div class="container">
      <div class="row">
        <div class="col-12">
          <div class="card">
            <input type="text" id="searchInput">
            <div class="btn btn-primary" onclick="fetchCharacters()"></div>
            <img src="" alt="" id="image" />
            <h3 id="name"></h3>
            <p id="birthdate"></p>
          </div>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>

    <script>
      const elImage = document.getElementById("image");
      const elName = document.getElementById("name");
      const elBirthdate = document.getElementById("birthdate");
      const elInput = document.getElementById("searchInput");

      const fetchCharacters = async () => {
        const response = await fetch(
          "https://potterapi-fedeperin.vercel.app/en/characters?search=" + elInput.value,
        );
        const characters = await response.json();

        elImage.src = characters[0].image;
      };
    </script>
  </body>
</html>
